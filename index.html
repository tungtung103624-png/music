<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的歌曲</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* 配色設定 */
            --bg-paper: #F5F0E6;      /* 溫暖米色背景 */
            --wood-dark: #5C4033;     /* 木質深棕色 */
            --wood-light: #8B5A2B;    /* 木質淺棕色 */
            --forest-green: #2E4F28;  /* 森林深綠 */
            --light-green: #D4E5D4;   /* 淺綠色高亮 */
            --sky-blue: #87CEEB;      /* 天空藍進度條 */
            --text-color: #333333;
            --shadow: 0 15px 35px rgba(92, 64, 51, 0.25); /* 柔和棕色陰影 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: var(--bg-paper);
            /* 加上一點微微的紙張/雜訊紋理感覺 */
            background-image: radial-gradient(var(--wood-light) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            background-position: 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* 播放器主體：木質窗框感 */
        .player-container {
            background-color: #FFFDF9;
            width: 90%;
            max-width: 400px;
            border: 12px solid var(--wood-light);
            border-radius: 40px; /* 非常圓潤的邊角 */
            box-shadow: var(--shadow), inset 0 0 15px rgba(92, 64, 51, 0.1);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 標題區 */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--wood-dark);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: var(--forest-green);
            font-size: 14px;
            opacity: 0.8;
        }
        .leaf-deco {
            color: var(--forest-green);
            margin: 0 5px;
        }

        /* 封面區 */
        .cover-art {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: var(--bg-paper);
            border: 6px solid var(--wood-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: var(--forest-green);
            margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
        }

        /* 歌曲標題 */
        .track-title {
            font-size: 28px;
            color: var(--forest-green);
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* 進度條 */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--wood-dark);
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #E0E0E0;
            outline: none;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--forest-green);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* 控制按鈕區 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--wood-dark);
            font-size: 20px;
            transition: transform 0.2s, color 0.2s;
        }
        button:hover {
            color: var(--forest-green);
            transform: scale(1.1);
        }
        .play-btn {
            font-size: 45px;
            color: var(--forest-green);
        }
        
        /* 模式按鈕狀態 */
        .mode-btn.active { color: var(--forest-green); }
        .mode-btn .mode-text { font-size: 10px; display: block; margin-top: 5px; font-family: 'Kosugi Maru';}

        /* 音量控制 */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 80%;
            margin-bottom: 25px;
            color: var(--wood-dark);
        }

        /* 搜尋框 */
        .search-box {
            width: 100%;
            position: relative;
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 35px;
            border-radius: 20px;
            border: 2px solid var(--wood-light);
            font-family: 'Kosugi Maru', sans-serif;
            font-size: 14px;
            background: var(--bg-paper);
            color: var(--wood-dark);
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--wood-light);
        }

        /* 播放清單 */
        .playlist-container {
            width: 100%;
            height: 180px;
            overflow-y: auto;
            border-radius: 15px;
            border: 2px dashed var(--wood-light);
            padding: 5px;
        }
        /* 隱藏捲軸但可滾動 */
        .playlist-container::-webkit-scrollbar { width: 6px; }
        .playlist-container::-webkit-scrollbar-thumb { background: var(--wood-light); border-radius: 10px; }

        .playlist { list-style: none; }
        .playlist li {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--wood-dark);
            font-weight: bold;
            transition: background 0.3s;
        }
        .playlist li:hover {
            background-color: rgba(212, 229, 212, 0.5);
        }
        .playlist li.active {
            background-color: var(--light-green);
            color: var(--forest-green);
        }
        .playlist li .list-icon {
            opacity: 0;
            margin-right: 10px;
            transition: opacity 0.3s;
        }
        .playlist li.active .list-icon {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="player-container">
        <div class="header">
            <h1><i class="fa-solid fa-leaf leaf-deco"></i>我的歌曲<i class="fa-solid fa-seedling leaf-deco"></i></h1>
            <p>MP3撥放器</p>
        </div>

        <div class="cover-art" id="coverArt">
            <i class="fa-solid fa-tree"></i>
        </div>

        <div class="track-title" id="trackTitle">Track 01</div>

        <div class="progress-container">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" value="0" min="0" max="100" step="1">
            <span id="durationTime">0:00</span>
        </div>

        <div class="controls">
            <button id="shuffleBtn" class="mode-btn" title="隨機播放">
                <i class="fa-solid fa-shuffle"></i>
            </button>
            <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn" class="play-btn"><i class="fa-solid fa-circle-play"></i></button>
            <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            <button id="repeatBtn" class="mode-btn" title="播放模式">
                <i class="fa-solid fa-arrow-right" id="repeatIcon"></i>
                <span class="mode-text" id="repeatText">不循環</span>
            </button>
        </div>

        <div class="volume-container">
            <i class="fa-solid fa-volume-low"></i>
            <input type="range" id="volumeBar" value="100" min="0" max="100">
            <i class="fa-solid fa-volume-high"></i>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="搜尋編號 (例: 01) 或路徑...">
        </div>

        <div class="playlist-container">
            <ul class="playlist" id="playlist">
                </ul>
        </div>

        <audio id="audio"></audio>
    </div>

    <script>
        // --- 1. 資料庫 (你的 MP3 路徑放這裡) ---
        const musicFiles = [
            'music/song1.mp3',
            'music/song2.mp3',
            'music/song3.mp3'
        ];

        // 隨機封面圖示庫
        const natureIcons = ['fa-tree', 'fa-seedling', 'fa-leaf', 'fa-cloud', 'fa-sun', 'fa-wind', 'fa-feather', 'fa-clover'];

        // --- 2. 狀態變數 ---
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        
        // repeatMode: 0 = 不循環, 1 = 全部循環, 2 = 單曲循環
        let repeatMode = 0; 
        const repeatConfig = [
            { icon: 'fa-arrow-right', text: '不循環' },
            { icon: 'fa-rotate', text: '全部循環' },
            { icon: 'fa-arrow-rotate-right', text: '單曲循環' }
        ];

        // --- 3. DOM 元素 ---
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const repeatIcon = document.getElementById('repeatIcon');
        const repeatText = document.getElementById('repeatText');
        
        const trackTitle = document.getElementById('trackTitle');
        const coverArt = document.getElementById('coverArt');
        const playlistEl = document.getElementById('playlist');
        
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        
        const volumeBar = document.getElementById('volumeBar');
        const searchInput = document.getElementById('searchInput');

        // --- 4. 初始化 ---
        function init() {
            renderPlaylist();
            loadTrack(currentIndex, false);
            updateVolumeColor(volumeBar.value);
            updateProgressColor(0);
        }

        // --- 5. 渲染播放清單 ---
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            musicFiles.forEach((path, index) => {
                const li = document.createElement('li');
                const trackNum = String(index + 1).padStart(2, '0');
                
                // 隱藏記錄真實路徑以供搜尋
                li.dataset.path = path.toLowerCase();
                li.dataset.index = index;
                
                li.innerHTML = `<i class="fa-solid fa-leaf list-icon"></i> Track ${trackNum}`;
                
                li.addEventListener('click', () => {
                    currentIndex = index;
                    loadTrack(currentIndex, true);
                });
                
                playlistEl.appendChild(li);
            });
        }

        // --- 6. 載入歌曲 ---
        function loadTrack(index, autoPlay = true) {
            // 設定音源
            audio.src = musicFiles[index];
            
            // 更新大標題與清單高亮
            const trackNum = String(index + 1).padStart(2, '0');
            trackTitle.innerText = `Track ${trackNum}`;
            
            // 隨機切換封面圖示
            const randomIcon = natureIcons[Math.floor(Math.random() * natureIcons.length)];
            coverArt.innerHTML = `<i class="fa-solid ${randomIcon}"></i>`;
            
            // 更新清單 UI
            const items = playlistEl.querySelectorAll('li');
            items.forEach(li => li.classList.remove('active'));
            if(items[index]) {
                items[index].classList.add('active');
                // 確保高亮的項目滾動到可見範圍
                items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            if (autoPlay) {
                playAudio();
            } else {
                pauseAudio();
            }
        }

        // --- 7. 播放控制邏輯 ---
        function playAudio() {
            isPlaying = true;
            audio.play();
            playBtn.innerHTML = '<i class="fa-solid fa-circle-pause"></i>';
        }

        function pauseAudio() {
            isPlaying = false;
            audio.pause();
            playBtn.innerHTML = '<i class="fa-solid fa-circle-play"></i>';
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) pauseAudio();
            else playAudio();
        });

        function nextTrack() {
            if (isShuffle) {
                let newIndex = currentIndex;
                while (newIndex === currentIndex && musicFiles.length > 1) {
                    newIndex = Math.floor(Math.random() * musicFiles.length);
                }
                currentIndex = newIndex;
            } else {
                currentIndex++;
                if (currentIndex > musicFiles.length - 1) {
                    currentIndex = 0;
                }
            }
            loadTrack(currentIndex);
        }

        function prevTrack() {
            if (isShuffle) {
                let newIndex = currentIndex;
                while (newIndex === currentIndex && musicFiles.length > 1) {
                    newIndex = Math.floor(Math.random() * musicFiles.length);
                }
                currentIndex = newIndex;
            } else {
                currentIndex--;
                if (currentIndex < 0) {
                    currentIndex = musicFiles.length - 1;
                }
            }
            loadTrack(currentIndex);
        }

        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        // --- 8. 模式切換邏輯 ---
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            repeatIcon.className = `fa-solid ${repeatConfig[repeatMode].icon}`;
            repeatText.innerText = repeatConfig[repeatMode].text;
            
            if (repeatMode > 0) {
                repeatBtn.classList.add('active');
            } else {
                repeatBtn.classList.remove('active');
            }
        });

        // 當歌曲結束時的處理
        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                // 單曲循環
                playAudio();
            } else if (repeatMode === 0 && currentIndex === musicFiles.length - 1 && !isShuffle) {
                // 不循環且是最後一首 -> 停止
                pauseAudio();
                audio.currentTime = 0;
            } else {
                // 全部循環 或 正在隨機 或 一般下一首
                nextTrack();
            }
        });

        // --- 9. 進度條與時間邏輯 ---
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        function updateProgressColor(percent) {
            progressBar.style.background = `linear-gradient(to right, var(--sky-blue) ${percent}%, #E0E0E0 ${percent}%)`;
        }

        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const duration = audio.duration;
            
            if (duration) {
                const percent = (current / duration) * 100;
                progressBar.value = percent;
                updateProgressColor(percent);
                currentTimeEl.innerText = formatTime(current);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audio.duration);
        });

        progressBar.addEventListener('input', (e) => {
            const percent = e.target.value;
            if (audio.duration) {
                audio.currentTime = (percent / 100) * audio.duration;
            }
            updateProgressColor(percent);
        });

        // --- 10. 音量控制邏輯 ---
        function updateVolumeColor(percent) {
            volumeBar.style.background = `linear-gradient(to right, var(--forest-green) ${percent}%, #E0E0E0 ${percent}%)`;
        }

        volumeBar.addEventListener('input', (e) => {
            const vol = e.target.value;
            audio.volume = vol / 100;
            updateVolumeColor(vol);
        });

        // --- 11. 搜尋/篩選邏輯 ---
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const items = playlistEl.querySelectorAll('li');
            
            items.forEach((li) => {
                const path = li.dataset.path;
                const index = parseInt(li.dataset.index);
                const trackNum = String(index + 1).padStart(2, '0');
                const trackText = `track ${trackNum}`;
                
                // 比對路徑或編號(包含 Track 01 或 01 本身)
                if (path.includes(keyword) || trackNum.includes(keyword) || trackText.includes(keyword)) {
                    li.style.display = 'flex';
                } else {
                    li.style.display = 'none';
                }
            });
        });

        // 啟動播放器
        init();
    </script>
</body>
</html>
